services:
  web:
    image: idealexpress-web:latest
    container_name: idealexpress-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M
